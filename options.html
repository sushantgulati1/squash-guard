<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squash Guard Options</title>
<style>
  :root{
    --bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#656d76;--border:#d0d7de;
    --accent:#1f883d;--accent-h:#1a7f37;--chip-bg:#ddf4ff;--chip-text:#0969da;--focus:#0969da;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--border:#30363d;
      --accent:#238636;--accent-h:#2ea043;--chip-bg:#388bfd26;--chip-text:#58a6ff;--focus:#58a6ff;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:48px 16px}
  .card{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:20px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:22px}
  label{display:block;font-weight:600;margin-bottom:6px}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}
  .chip{display:inline-flex;align-items:center;height:26px;line-height:1;background:var(--chip-bg);
    color:var(--chip-text);padding:0 12px;border-radius:999px;
    font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  code{font:12px ui-monospace,Menlo,monospace}
  .empty{color:var(--muted);font-size:12px;font-style:italic}
  footer{display:flex;align-items:center;gap:12px;padding-top:4px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 20px;
    font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
  button:hover{background:var(--accent-h)}
  .support{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px;
    padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:all .15s}
  .support:hover{color:var(--text);border-color:var(--muted)}
  #status{color:var(--accent-h);opacity:0;transition:opacity .2s;font-weight:500}
  #status.show{opacity:1}
</style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">🛡</div>
      <h1>Squash Guard</h1>
    </header>
    <p class="sub">Disable “Squash and merge” on GitHub PRs targeting protected branches.</p>

    <div class="field">
      <label for="branches">Protected branches</label>
      <input id="branches" placeholder="qa, staging, main" autocomplete="off" spellcheck="false">
      <div class="chips" id="branches-chips"></div>
      <div class="hint">Comma-separated. Matched against the PR’s base branch.</div>
    </div>

    <div class="field">
      <label for="owners">GitHub orgs / repos</label>
      <input id="owners" placeholder="my-org, other-org/some-repo" autocomplete="off" spellcheck="false">
      <div class="chips" id="owners-chips"></div>
      <div class="hint">Comma-separated. Use <code>org</code> for a whole org or <code>org/repo</code> for a single repo. Leave empty to apply everywhere.</div>
    </div>

    <footer>
      <button id="save">Save</button>
      <span id="status">✓ Saved</span>
      <a class="support" href="https://ko-fi.com/sushantgulati" target="_blank" rel="noopener noreferrer">☕ Support on Ko-fi</a>
    </footer>
  </div>
  <script src="options.js"></script>
</body>
</html>
